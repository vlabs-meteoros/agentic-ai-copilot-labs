<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaveriRooms</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>KaveriRooms <span>Mysuru office</span></h1>
    <nav>
      <button id="prev-day" type="button" title="Previous day">&larr;</button>
      <input id="day" type="date" aria-label="Day to show">
      <button id="next-day" type="button" title="Next day">&rarr;</button>
    </nav>
  </header>

  <main>
    <section>
      <h2 id="day-title">Bookings</h2>
      <p id="closed" class="closed" hidden></p>
      <div class="grid-wrap"><table id="grid"></table></div>
      <p class="hint">Select a booking to cancel it. &#8635; marks a weekly series.</p>
    </section>

    <section>
      <h2>Book a room</h2>
      <form id="booking-form">
        <label>Room <select name="roomId" required></select></label>
        <label>Date <input name="date" type="date" required></label>
        <label>Start <select name="start" required></select></label>
        <label>End <select name="end" required></select></label>
        <label>Title <input name="title" maxlength="60" required placeholder="Sprint planning"></label>
        <label>Organiser <input name="organiser" required placeholder="Your name"></label>
        <label>Attendees <input name="attendees" type="number" min="1" value="2" required></label>
        <label>Repeat every week for <input name="weeks" type="number" min="1" max="12" value="1" required>
          <small>weeks (1 = just this day, up to 12)</small></label>
        <button type="submit">Book</button>
      </form>
      <p id="message" role="status"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
